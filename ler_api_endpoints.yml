  path: /api/[version]/graveforespoergsel
  versions:
    - version: v1
- integration: 24
  name: Hent graveforespørgselskvittering
  method: GET
  path: /api/[version]/graveforespoergselKvittering/{id}
  versions:
    - version: v1
- integration: 25
  name: Hent status på ledningspakker
  method: GET
  path: /api/[version]/ledningspakkeStatus
  versions:
    - version: v1
- integration: 26
  name: Kvitter for ledningspakke
  method: POST
  path: /api/[version]/ledningspakkeModtaget/{id}
  versions:
    - version: v1
- integration: 27
