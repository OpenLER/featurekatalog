# LER's REST-endpoints og deres versioner, håndskrevet ud fra:
# - Swagger-specen (services-swagger[-extest].ler.dk/swagger/docs/v1, hentet 2026-07-28
#   via ler-dk-crawler/fetch_api_spec.py; prod og extest er identiske)
# - Oversigtstabellen i C0200 - Guide to Web Services v1.50 (navne og integrationsnumre)
# - Release notes (se ler_releases.yml) for hvilken release der indførte en version
#
# release: den server-release, der indførte versionen. Tom = fra før 2.2.4, som er den
# ældste release note på ler.dk. lukkes: varslet lukkedato for versionen.

- integration: 10
  name: Hent anmodninger
  method: GET
  path: /api/[version]/anmodning
  versions:
    - version: v4
- integration: 11
  name: Kvitter for anmodning
  method: POST
  path: /api/[version]/anmodningModtaget/{id}
  versions:
    - version: v4
- integration: 13
  name: Send graveforespørgselssvar
  method: POST
  path: /api/[version]/graveforespoergselSvar/{id}
  versions:
    - version: v1
      lukkes: 2027-01-01
    - version: v2
      release: 2.2.5
      lukkes: 2027-01-01
    - version: v3
      release: 2.2.8
- integration: 15
  name: Hent status på ledningspakke
  method: GET
  path: /api/[version]/ledningspakkeStatus/{id}
  versions:
    - version: v1
- integration: 16
  name: Hent ledningspakke
  method: GET
  path: /api/[version]/ledningspakke/{id}
  versions:
    - version: v1
    - version: v2
      release: 2.2.5
- integration: 18
  name: Indberet graveskade
