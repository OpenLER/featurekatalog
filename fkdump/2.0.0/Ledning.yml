navn: Ledning
pakke: 'Pakke: Fælles'
Foretrukken term: ledning
Definition: kabel eller rør der har som funktion at lede noget fra et sted til et andet
Note: |-
  Denne definition er baseret på den tekniske betydning af termen "ledning" i Den Danske Ordbog.
  I LER-lovgivningen anvendes termen i en mere specifik betydning. I lovens definition (LBK nr 206 af 15/03/2018 §5) er betydningen indsnævret til kun at omfatte ledninger, der er nedgravet i jord eller nedgravet i eller anbragt på havbunden - og altså ikke ledninger på jorden eller i luften. Betydningen er desuden udvidet til at omfatte betydelige ledningskomponenter (LBK nr 1674 af 26/12/2017, 12).
  I forsyningsbranchen anvendes termen "ledninger" ofte bredt om ledningsanlæg inklusive kabler, rør, relaterede ledningskomponenter og ledningstraceer.
  I Den Danske Ordbog beskrives også en almen betydning af "ledning", som kun omfatter kabel – ikke rør. Det er denne betydning, der ofte anvendes i hverdagssproget.
Kilde: LER-forretning
Subtype af: LedningEllerLedningstrace
Supertype til: |-
  AndenLedning
  Elledning
  LedningUkendtForsyningsart
  Rørledning
  Telekommunikationsledning
Type: Featuretype
Abstrakt: ja
attributter:
- Navn: geometri
  Foretrukken term: geometri af midterlinjen
  Definition: geografisk placering af midterlinjen
  Anvendelsesnote: Vertikale koordinater af geometrien angives for overkanten af ledningen.
  Voidable: nej
  Multiplicitet: 0..1
  Type: GM_Curve
- Navn: indeholderLedninger
  Foretrukken term: indeholder ledninger
  Definition: indeholder en eller flere ledninger
  Note: Anvendes når der er behov for at formidle at en anden ledning er placeret i denne ledning. Benyttes som udgangspunkt, hvis ledningsejeren ikke ejer den ledning der er placeret i ledningen. Dette kan hjælpe graveaktøren til at identificere i hvilken ledning en ledning, der "ligger i ledning", er placeret.
  Kilde: LER-forretning
  Voidable: ja
  Multiplicitet: 0..1
  Type: Boolean
- Navn: ledningsetableringsmetode
  Foretrukken term: ledningsetableringsmetode
  Definition: fremgangsmåde som anvendes når en ledning skal anlægges
  Voidable: nej
  Multiplicitet: 0..1
  Type: Ledningsetableringsmetodetype (Enumeration)
  Værdier:
  - værdi: nedgravning
    definition: |-
      metode hvor der graves en ledningsgrav med gravemaskine eller skovl
      Note: Metoden omfatter også kædegravning. kædegravning: gravning med et sæt knive eller tænder monteret på en kæde eller et hjul, der under rotation presses fra jordoverfladen gennem jorden, således at der opstår en åben rende [DS 475:2012]
  - værdi: styret boring
    definition: |-
      etablering af en ledning ved boring
      Anvendelsesnote: Dybden kan afvige meget fra ledningens normale nedlægningsdybde.
      Kilde: [DS 475:2012]
  - værdi: indvendig foring
    definition: |-
      etablering af en ledning inden i en eksisterende
      Note: Definitionen dækker metoderne: foring med lange sammensvejste rør, stram foring og strømpeføring.
      Kilde: [DS 475:2012]
  - værdi: foring med lange sammensvejste rør
    definition: |-
      en lang sammensvejst PE-ledning trækkes ind i den eksisterende ledning via en mindre opgravning
      Kilde: [DS 475:2012]
  - værdi: stram foring
    definition: |-
      en lang sammenfoldet plastledning, der trækkes ind i den eksisterende ledning. Ved hjælp af varme og tryk udvides den til den oprindelige dimension
      Kilde: [DS 475:2012]
  - værdi: strømpeforing
    definition: |-
      en imprægneret strømpe af filt eller glasfiber, der trækkes ind i den eksisterende ledning. Her udvides den ved hjælp af overtryk, hvorefter den hærdes enten med varme eller lys
      Kilde: [DS 475:2012]
  - værdi: nedpløjning
    definition: |-
      etablering af ledning i jord med en bugseret eller selvkørende ledningsplov, hvis skær ved passage gennem jorden efterlader en eller flere ledninger og evt. advarselsbånd eller afdækning
      Kilde: [DS 475:2012]
  - værdi: jordfortrængning
    definition: |-
      etablering af en ledning uden ledningsgrav på en sådan måde, at der skabes plads til ledningen, uden at den tilsvarende jord fjernes
      Note: Definitionen dækker metoderne: skydning med jordraket og rørsprængning.
      Kilde: [DS 475:2012]
  - værdi: rørsprængning
    definition: |-
      den eksisterende ledning knuses ved hjælp af et skærehoved eller en lufttryksdrevet hammer, og den knuste ledning presses ud i omkringfyldningen
      Note: Ved rørsprængning kan en eksisterende ledning udskiftes med en ledning i samme eller større dimension.
      Anvendelsesnote: Der ligger fragmenter fra den gamle ledning.
      Kilde: [DS 475:2012]
  - værdi: skydning med jordraket
    definition: |-
      en jordraket består af en slaghammer, der bevæger sig frem i undergrunden ved brug af luft eller hydraulik. Det blivende rør installeres enten sammen med fremføringen af jordraketten, eller når den trækkes tilbage
      Kilde: [DS 475:2012]
  - værdi: underboring
    definition: |-
      etablering af en ledning uden ledningsgrav på en sådan måde, at jorden fjernes i et vist omfang af borevolumenet. Det erstattes af medierøret og boremudder og/eller evt. et forstærkende indpumpet materiale
      Note: Definitionen dækker metoderne: styret boring, pilotrørsmetoden og mikrotunnellering.
      Kilde: [DS 475:2012]
  - værdi: mikrotunnellering
    definition: |-
      mikrotunnellering er en laserstyret gennempresningsmetode, hvor indpresning af rør sker fra en hydraulisk presse- eller borerig. Et roterende borehoved i fronten af røret løsborer materialet, der bortskaffes fra rørfronten. Mikrotunnellering udføres fra e
      Kilde: [DS 475:2012]
  - værdi: pilotrørsmetoden
    definition: |-
      en videooptisk styret boremetode, der giver mulighed for kontinuerlig kontrol og styring af pilotrøret under hele forløbet af gennempreseningen
      Note: Rørledningen installeres over 2 omgange. Først styres pilotrøret igennem. Herefter udføres der itrækning af medierøret.
      Kilde: [DS 475:2012]
  Maksimumlængde: '50'
- Navn: liggerILedning
  Foretrukken term: ligger i ledning
  Definition: ledningen er placeret i en anden ledning
  Note: Anvendes når der er behov for at formidle at en ledning er placeret i en anden ledningsejers ledning, for at angive at ledningen ikke er umiddelbart synlig for graveaktøren.
  Kilde: LER-forretning
  Voidable: nej
  Multiplicitet: 0..1
  Type: Boolean
- Navn: niveau
  Foretrukken term: niveau
  Definition: placering i forhold til terræn
  Voidable: nej
  Multiplicitet: 0..1
  Type: Niveautype (Enumeration)
  Værdier:
  - værdi: delvist under terræn
    definition: |-
      delvist under et landområdes jordoverflade
      Kilde: baseret på [DDO]
  - værdi: over terræn
    definition: |-
      over et landområdes jordoverflade
      Kilde: baseret på [DDO]
  - værdi: under terræn
    definition: |-
      under et landområdes jordoverflade
      Kilde: baseret på [DDO]
  Maksimumlængde: '50'
- Navn: udvendigDiameter
  Foretrukken term: udvendig diameter
  Definition: (se billede på diagram)
  Voidable: ja
  Multiplicitet: 0..1
  Type: Measure
- Navn: udvendigFarve
  Foretrukken term: udvendig farve
  Definition: farve af yderside
  Eksempel: blå (for fx vandrør)
  Voidable: nej
  Multiplicitet: 0..*
  Type: CharacterString
  Maksimumlængde: '50'
- Navn: udvendigMateriale
  Foretrukken term: udvendige materiale af ledning
  Definition: stof brugt til fremstilling af lednings yderside
  Anvendelsesnote: Materialet som en entreprenør møder når der graves.
  Eksempel: stål, plast, støbejern
  Voidable: nej
  Multiplicitet: 0..1
  Type: CharacterString
  Maksimumlængde: '50'
restriktioner:
- Navn: driftsstatusVoidrestriktion
  Udtryk: |-
    Driftsstatussen må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
    Note: m.a.o.: værdien for driftstatussen skal være angivet hvis etableringstidspunktet er efter skæringsdatoen, selvom denne attribut er deklareret som voidable.
- Navn: fareklasseVoidrestriktion
  Udtryk: |-
    Fareklassen må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
    Note: m.a.o.: værdien for fareklassen skal være angivet hvis etableringstidspunktet er efter skæringsdatoen, selvom denne attribut er deklareret som voidable.
- Navn: geometriBetingelse
  Udtryk: |-
    Geometrien skal være angivet hvis alle følgende betingelser er sande:
    * ledningen er ikke indeholdt i et ledningstracé
    * ledningen er ikke indeholdt i en anden ledning
- Navn: geometriDatatyperestriktion
  Udtryk: |-
    Geometrien skal anvende lineær interpolation.
    Note: I en GML-indkodning betyder det, at geometrien, som er en kurve, skal have en geometritype der er en af følgende [GML SF]:
    * gml:LineString
    * gml:Curve med segmenter af typen gml:LineStringSegment
- Navn: nøjagtighedsklasseBetingelse
  Udtryk: |-
    Nøjagtighedsklassen skal være angivet hvis geometrien er angivet.
    Nøjagtighedsklassen må ikke være angivet hvis geometrien ikke er angivet.
- Navn: nøjagtighedsklasseVoidrestriktion
  Udtryk: |-
    Nøjagtighedsklassen må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
    Note: m.a.o.: værdien for nøjagtighedsklassen skal være angivet hvis etableringstidspunktet er efter skæringsdatoen, selvom denne attribut er deklareret som voidable.
- Navn: udvendigDiameterMåleenhedsrestriktion
  Udtryk: Måleenheden for den udvendige diameter skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
- Navn: udvendigDiameterVoidrestriktion
  Udtryk: Den udvendige diameter må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
associationsroller:
- Navn: indeholdtLedning
  Foretrukken term: indeholdt ledning
  Definition: ledning som ligger i den givne ledning
  Voidable: ja
  Multiplicitet: 0..*
  Type: Ledning (Featuretype)
- Navn: slutkomponent
  Foretrukken term: slutkomponent
  Definition: komponent hvor ledningen slutter
  Note: Der er tale om en brydende komponent. Formålet med denne egenskab er at have mulighed for at skabe et sammenhængende ledningsnet.
  Voidable: nej
  Multiplicitet: 0..1
  Type: Ledningskomponent (Featuretype)
- Navn: startkomponent
  Foretrukken term: startkomponent
  Definition: komponent hvor ledningen starter
  Note: Der er tale om en brydende komponent. Formålet med denne egenskab er at have mulighed for at skabe et sammenhængende ledningsnet.
  Voidable: nej
  Multiplicitet: 0..1
  Type: Ledningskomponent (Featuretype)
