navn: Rørledning
pakke: 'Pakke: Fælles'
Foretrukken term: rørledning
Definition: ledning som består af en yderskal og et eller flere tomrum indeni
Subtype af: Ledning
Supertype til: |-
  Afløbsledning
  Føringsrør
  Gasledning
  Olieledning
  TermiskLedning
  Vandledning
Type: Featuretype
Abstrakt: ja
