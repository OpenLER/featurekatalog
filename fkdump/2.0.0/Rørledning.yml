restriktioner:
- Navn: geometriVertikaleKoordinaterRestriktion
  Udtryk: En vertikal koordinat i geometrien må ikke være ukendt-værdien på -99 hvis etableringstidspunktet er efter skæringsdatoen.
- Navn: udvendigBreddeBetingelse
  Udtryk: |-
    Den udvendige bredde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen
    * tværsnitsformen er ikke cirkulær.
    Den udvendige bredde må ikke være angivet hvis tværsnitsformen er cirkulær.
- Navn: udvendigBreddeMåleenhedsrestriktion
  Udtryk: Måleenheden for den udvendige bredde skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
- Navn: udvendigBreddeVoidrestriktion
  Udtryk: Den udvendige bredde må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
- Navn: udvendigDiameterBetingelse
  Udtryk: |-
    Den udvendige diameter skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen
    * tværsnitsformen er cirkulær.
    Den udvendige diameter må ikke være angivet hvis tværsnitsformen ikke er cirkulær.
- Navn: udvendigHøjdeBetingelse
  Udtryk: |-
    Den udvendige højde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen
    * tværsnitsformen er ikke cirkulær.
    Den udvendige højde må ikke være angivet hvis tværsnitsformen er cirkulær.
- Navn: udvendigHøjdeMåleenhedsrestriktion
  Udtryk: Måleenheden for den udvendige højde skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
- Navn: udvendigHøjdeVoidrestriktion
  Udtryk: Den udvendige højde må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
