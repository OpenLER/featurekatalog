navn: Føringsrør
pakke: 'Pakke: Fælles'
Foretrukken term: føringsrør
Definition: rør hvori der kan føres en eller flere ledninger
Kilde: '[LER-loven]'
Subtype af: Rørledning
Type: Featuretype
attributter:
- Navn: forsyningsart
  Foretrukken term: forsyningsart
  Definition: forsyningsarten eller -arterne af den ledning eller de ledninger som ligger i føringsrøret
  Voidable: nej
  Multiplicitet: 0..*
  Type: Forsyningsart (Kodeliste)
  Værdier:
  - værdi: afløb
    definition: |-
      bortledning af vand
      opsamling og bortledning af spildevand, regnvand og drænvand
  - værdi: el
    definition: |-
      elforsyning
      produktion og distribution af elektricitet
  - værdi: fjernvarme/fjernkøling
    definition: |-
      fjernvarme eller fjernkøling
      produktion og distribution af varme eller kulde
  - værdi: gas
    definition: |-
      gasforsyning
      indvinding og distribution af gas
  - værdi: olie
    definition: |-
      olieforsyning
      indvinding og distribution af olie
      Note: olie: tyktflydende væske, der ikke er blandbar med vand [DSD] Omfatter bl.a. mineralolie (også kaldt jordolie eller råolie) og vegetabilsk olie. Olie anvendes bl.a. som energikilde, til opvarmning, i kraftværker og som brændstof til biler, fly og skibe [baseret på DSD].
  - værdi: telekommunikation
    definition: |-
      transmission, emission eller modtagelse af tegn, signaler, skrift, billeder og lyd eller intelligens af enhver art vha. tråd, radio, optiske eller andre elektromagnetiske systemer
      Kilde: [IEV, ref 701-01-05]
  - værdi: vand
    definition: |-
      vandforsyning
      indvinding og distribution af vand
      Kilde: [DSD]
  Maksimumlængde: '50'
  Modelleringsnote: Attributten forsyningsart er deklareret som at værende ordnet. Rækkefølgen af værdierne, når der er flere til stede, er bestemt af vigtigheden af forsyningsarten for føringsrørets karakter. Den primære forsyningsart kommer først.
  GML-note: Den primære forsyningsart kommer først, når der er flere forsyningsarter til stede. Det kan have betydning for, hvordan føringsrør håndteres i LER-kortviseren.
restriktioner: []
associationsroller: []
