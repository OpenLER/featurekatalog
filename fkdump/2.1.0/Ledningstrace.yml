navn: Ledningstrace
pakke: 'Pakke: Fælles'
Foretrukken term: ledningstrace
Definition: linjeføring hvor der ligger en eller flere ledninger i relativ nærhed af hinanden
Juridisk kilde: '[LER-bekendtgørelsen]'
Subtype af: LedningEllerLedningstrace
Type: Featuretype
attributter:
- Navn: bredde
  Foretrukken term: bredde
  Definition: udstrækning på tværs af lednings midterlinje
  Anvendelsesnote: Kan angives, hvis det anses for nyttigt. Fx for traceer der er større end man ellers vil forvente.
  Voidable: ja
  Multiplicitet: 0..1
  Type: Measure
- Navn: forsyningsart
  Foretrukken term: forsyningsart
  Definition: forsyningsarten af den ledning eller de ledninger som ligger i ledningstraceet
  Voidable: ja
  Multiplicitet: 1..*
  Type: Forsyningsart (Kodeliste)
  Værdier:
  - værdi: afløb
    definition: |-
      bortledning af vand
      opsamling og bortledning af spildevand, regnvand og drænvand
  - værdi: el
    definition: |-
      elforsyning
      produktion og distribution af elektricitet
  - værdi: fjernvarme/fjernkøling
    definition: |-
      fjernvarme eller fjernkøling
      produktion og distribution af varme eller kulde
  - værdi: gas
    definition: |-
      gasforsyning
      indvinding og distribution af gas
  - værdi: olie
    definition: |-
      olieforsyning
      indvinding og distribution af olie
      Note: olie: tyktflydende væske, der ikke er blandbar med vand [DSD] Omfatter bl.a. mineralolie (også kaldt jordolie eller råolie) og vegetabilsk olie. Olie anvendes bl.a. som energikilde, til opvarmning, i kraftværker og som brændstof til biler, fly og skibe [baseret på DSD].
  - værdi: telekommunikation
    definition: |-
      transmission, emission eller modtagelse af tegn, signaler, skrift, billeder og lyd eller intelligens af enhver art vha. tråd, radio, optiske eller andre elektromagnetiske systemer
      Kilde: [IEV, ref 701-01-05]
  - værdi: vand
    definition: |-
      vandforsyning
      indvinding og distribution af vand
      Kilde: [DSD]
  Maksimumlængde: '50'
  Modelleringsnote: Attributten forsyningsart er deklareret som at værende ordnet. Rækkefølgen af værdierne, når der er flere til stede, er bestemt af vigtigheden af forsyningsarten for ledningstraceets karakter. Den primære forsyningsart kommer først. Hvis alle ledningstraceets indeholdte ledninger er angivet, så er forsningsarten/-arterne på ledningtraceet allerede kendt, via klassen af ledningerne (Afløbsledning, Elledning, osv.). Der er dog valgt, alligevel at have forsyningsarten/-arterne eksplicit som en attribut på Ledningstrace, for at forenkle visning af ledningsoplysninger.
  GML-note: Den primære forsyningsart kommer først, når der er flere forsyningsarter til stede. Det kan have betydning for, hvordan ledningstraceer håndteres i LER-kortviseren.
- Navn: geometri
  Foretrukken term: geometri af midterlinjen
  Definition: geografisk placering af midterlinjen
  Anvendelsesnote: Vertikale koordinater af geometrien angives for overkanten af ledningstraceet.
  Voidable: nej
  Multiplicitet: '1'
  Type: GM_MultiCurve
- Navn: ledningsetableringsmetode
  Foretrukken term: ledningsetableringsmetode til ledninger i ledningstraceet
  Definition: fremgangsmåde som anvendes når en ledning skal anlægges
  Voidable: nej
  Multiplicitet: 0..1
  Type: Ledningsetableringsmetodetype (Enumeration)
  Værdier:
  - værdi: nedgravning
    definition: |-
      metode hvor der graves en ledningsgrav med gravemaskine eller skovl
      Note: Metoden omfatter også kædegravning. kædegravning: gravning med et sæt knive eller tænder monteret på en kæde eller et hjul, der under rotation presses fra jordoverfladen gennem jorden, således at der opstår en åben rende [DS 475:2012]
  - værdi: styret boring
    definition: |-
      etablering af en ledning ved boring
      Anvendelsesnote: Dybden kan afvige meget fra ledningens normale nedlægningsdybde.
      Kilde: [DS 475:2012]
  - værdi: indvendig foring
    definition: |-
      etablering af en ledning inden i en eksisterende
      Note: Definitionen dækker metoderne: foring med lange sammensvejste rør, stram foring og strømpeføring.
      Kilde: [DS 475:2012]
  - værdi: foring med lange sammensvejste rør
    definition: |-
      en lang sammensvejst PE-ledning trækkes ind i den eksisterende ledning via en mindre opgravning
      Kilde: [DS 475:2012]
  - værdi: stram foring
    definition: |-
      en lang sammenfoldet plastledning, der trækkes ind i den eksisterende ledning. Ved hjælp af varme og tryk udvides den til den oprindelige dimension
      Kilde: [DS 475:2012]
  - værdi: strømpeforing
    definition: |-
      en imprægneret strømpe af filt eller glasfiber, der trækkes ind i den eksisterende ledning. Her udvides den ved hjælp af overtryk, hvorefter den hærdes enten med varme eller lys
      Kilde: [DS 475:2012]
  - værdi: nedpløjning
    definition: |-
      etablering af ledning i jord med en bugseret eller selvkørende ledningsplov, hvis skær ved passage gennem jorden efterlader en eller flere ledninger og evt. advarselsbånd eller afdækning
      Kilde: [DS 475:2012]
  - værdi: jordfortrængning
    definition: |-
      etablering af en ledning uden ledningsgrav på en sådan måde, at der skabes plads til ledningen, uden at den tilsvarende jord fjernes
      Note: Definitionen dækker metoderne: skydning med jordraket og rørsprængning.
      Kilde: [DS 475:2012]
  - værdi: rørsprængning
    definition: |-
      den eksisterende ledning knuses ved hjælp af et skærehoved eller en lufttryksdrevet hammer, og den knuste ledning presses ud i omkringfyldningen
      Note: Ved rørsprængning kan en eksisterende ledning udskiftes med en ledning i samme eller større dimension.
      Anvendelsesnote: Der ligger fragmenter fra den gamle ledning.
      Kilde: [DS 475:2012]
  - værdi: skydning med jordraket
    definition: |-
      en jordraket består af en slaghammer, der bevæger sig frem i undergrunden ved brug af luft eller hydraulik. Det blivende rør installeres enten sammen med fremføringen af jordraketten, eller når den trækkes tilbage
      Kilde: [DS 475:2012]
  - værdi: underboring
    definition: |-
      etablering af en ledning uden ledningsgrav på en sådan måde, at jorden fjernes i et vist omfang af borevolumenet. Det erstattes af medierøret og boremudder og/eller evt. et forstærkende indpumpet materiale
      Note: Definitionen dækker metoderne: styret boring, pilotrørsmetoden og mikrotunnellering.
      Kilde: [DS 475:2012]
  - værdi: mikrotunnellering
    definition: |-
      mikrotunnellering er en laserstyret gennempresningsmetode, hvor indpresning af rør sker fra en hydraulisk presse- eller borerig. Et roterende borehoved i fronten af røret løsborer materialet, der bortskaffes fra rørfronten. Mikrotunnellering udføres fra e
      Kilde: [DS 475:2012]
  - værdi: pilotrørsmetoden
    definition: |-
      en videooptisk styret boremetode, der giver mulighed for kontinuerlig kontrol og styring af pilotrøret under hele forløbet af gennempreseningen
      Note: Rørledningen installeres over 2 omgange. Først styres pilotrøret igennem. Herefter udføres der itrækning af medierøret.
      Kilde: [DS 475:2012]
  Maksimumlængde: '50'
  Modelleringsnote: Denne attribut er ikke lagt på LedningEllerLedningstrace efter ønsket om at tilføje "ledningsetableringsmetode" på Ledningstrace, for at sikre bagudkompatibiliteten for de applikationer som er afhængige af XML-elementernes rækkefølge i GML-applikationsskemaet.
restriktioner:
- Navn: breddeMåleenhedsrestriktion
  Udtryk: |-
    Måleenheden for bredden skal være millimeter.
    Millimeter skal angives med symbolet mm [UCUM].
- Navn: geometriDatatyperestriktion
  Udtryk: |-
    Geometrien skal anvende lineær interpolation.
    Note: I en GML-indkodning betyder det, at geometrien, som er en multikurve, skal består af segmenter som skal have en geometritype der er en af følgende [GML SF]:
    * gml:LineString
    * gml:Curve med segmenter af typen gml:LineStringSegment
- Navn: nøjagtighedsklasseBetingelse
  Udtryk: |-
    Nøjagtighedsklassen skal være angivet.
    Note: Denne restriktion er nødvendig, da nøjagtighedsklasse er defineret på LedningEllerLedningstrace med multiplicitet 0..1.
- Navn: nøjagtighedsklasseVoidrestriktion
  Udtryk: |-
    Nøjagtighedsklassen må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer.
- Navn: vejledendeDybdeBetingelse
  Udtryk: |-
    Den vejledende dybde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99;
    * den primære forsyningsart er el eller telekommunikation.
- Navn: vejledendeDybdeVoidrestriktion
  Udtryk: |-
    Den vejledende dybde må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99;
    * den primære forsyningsart er el eller telekommunikation.
associationsroller:
- Navn: indeholdtLedning
  Foretrukken term: indeholdt ledning
  Definition: ledning som ligger i ledningstraceet
  Voidable: ja
  Multiplicitet: 0..*
  Type: Ledning (Featuretype)
