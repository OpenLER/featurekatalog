# LER-serverens releases, håndskrevet ud fra tidsplanen i hver release note
# (Driftsinformation -> Releasenoter på ler.dk, hentet via ler-dk-crawler).
# Datoerne er de planlagte deploy-datoer fra release noten. extest mangler for
# de hotfixes, der kun blev lagt direkte i produktion. datamodel er sat på de
# releases, der indførte en ny version af datamodellen (featurekataloget/XSD),
# ifølge release noten. summary er et kort resumé af release noten.
# Ældste først; nye releases tilføjes nederst.

